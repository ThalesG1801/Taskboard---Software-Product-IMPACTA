<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>TaskBoard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f6fa;
        }

        h1 {
            text-align: center;
            padding: 20px;
            background: #2f3640;
            color: white;
            margin: 0;
        }
        

        h2 {
            margin-top: 30px;
        }

        form {
            display: flex;
            gap: 10px;
            padding: 20px;
            justify-content: center;
        }

        input {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            background: #40739e;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #273c75;
        }

        .board {
            display: flex;
            gap: 20px;
            padding: 20px;
            justify-content: center;
        }

        .coluna {
            width: 250px;
            background: #dcdde1;
            border-radius: 10px;
            padding: 10px;
        }

        .coluna h3 {
            text-align: center;
        }

        .tarefa {
            background: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: grab;
            transition: 0.2s;
        }

        .tarefa:hover {
            transform: scale(1.02);
        }

        .tarefa:active {
            opacity: 0.6;
        }

        div[id^="coluna-"] {
            min-height: 300px;       
            min-width: 200px;
            padding: 10px;
            background: #f4f4f4;
            border: 2px dashed #ccc;  
        }
        
        div[id^="coluna-"]:hover {
            background: #e0e0e0;
        }

        #menuBtn {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1000;
        }

        #sidebar {
            position: fixed;
            top: 0;
            left: -260px;
            width: 250px;
            height: 100%;
            background: #2f3640;
            color: white;
            padding: 20px;
            transition: 0.3s;
            overflow-y: auto;
        }

        #sidebar.aberto {
            left: 0;
        }

        #listaBoards div {
            margin-bottom: 10px;
            padding: 8px;
            background: #414b57;
            border-radius: 5px;
            cursor: pointer;
        }

        #listaBoards button {
            margin-left: 5px;
        }

        .board-item {
            margin-bottom: 10px;
            padding: 8px;
            background: #414b57;
            border-radius: 5px;
            cursor: pointer;
        }

        .board-item.ativo {
            background-color: #0984e3 !important;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Boards</h2>
        <div id="listaBoards"></div>
        <button id="novoBoard">➕ Novo Board</button>
    </div>
    <button id="menuBtn">☰</button>
    <h1 id="tituloBoard">TaskBoard</h1>

    <h2 style="text-align: center;">Criar Tarefa</h2>
    <form id="formTarefa">
        <input type="text" id="titulo" placeholder="Título" required>
        <input type="text" id="descricao" placeholder="Descrição" required>

        <select id="prioridade">
            <option value="Baixa">Baixa</option>
            <option value="Média" selected>Média</option>
            <option value="Alta">Alta</option>
        </select>
        <input type="date" id="prazo">

        <input type="number" id="coluna_id" placeholder="ID da Coluna" value="1" required>
        <button type="submit">Criar</button>
    </form>



    <div class="board">
    <div class="coluna">
        <h3>A Fazer</h3>
        <div id="coluna-1"></div>
    </div>

    <div class="coluna">
        <h3>Em Progresso</h3>
        <div id="coluna-2"></div>
    </div>

    <div class="coluna">
        <h3>Concluído</h3>
        <div id="coluna-3"></div>
    </div>
</div>

    <script>
        const form = document.getElementById("formTarefa");
        const tarefasDiv = document.getElementById("tarefas");
        const menuBtn = document.getElementById("menuBtn");
        const sidebar = document.getElementById("sidebar");

        menuBtn.onclick = () => {
            sidebar.classList.toggle("aberto");
        };

        document.getElementById("novoBoard").onclick = criarBoard;
        let boardAtual = 1;

        async function listarBoards() {

            const res = await fetch("http://localhost:3000/boards");
            const boards = await res.json();
            const lista = document.getElementById("listaBoards");

            lista.innerHTML = "";

            boards.forEach(board => {

                const div = document.createElement("div");
                div.className = "board-item";

                if (board.id === boardAtual) {
                    div.classList.add("ativo");

                    document.getElementById("tituloBoard").innerText =
                        "📋 " + board.nome;
                }

                div.innerHTML = `
                    ${board.nome}
                    <button onclick="editarBoard(${board.id}, '${board.nome}')">✏️</button>
                    <button onclick="deletarBoard(${board.id})">🗑️</button>
                `;

                div.onclick = () => {
                    boardAtual = board.id;
                    listarTarefas();
                    listarBoards();
                };

                lista.appendChild(div);
            });
        }

        async function criarBoard() {

            const nome = prompt("Nome do novo board:");

            if (!nome) return;

            await fetch("http://localhost:3000/boards", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ nome })
            });

            const res = await fetch("http://localhost:3000/boards");
            const boards = await res.json();

            boardAtual = boards[boards.length - 1].id;

            listarBoards();
            listarTarefas();
        }

        async function editarBoard(id, nomeAtual) {

            const novoNome = prompt(
                "Novo nome do board:",
                nomeAtual
            );

            if (!novoNome) return;

            await fetch(`http://localhost:3000/boards/${id}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nome: novoNome
                })
            });

            listarBoards();
        }

        async function deletarBoard(id) {
            const boards = document.querySelectorAll("#listaBoards > div");

            if (boards.length <= 1) {
                alert("É necessário existir pelo menos um board.");
                return;
            }
            const confirmar = confirm(
                "Deseja excluir este board?"
            );

            if (!confirmar) return;

            await fetch(`http://localhost:3000/boards/${id}`, {
                method: "DELETE"
            });

            listarBoards();
        }

        async function listarTarefas() {
            const res = await fetch(
                `http://localhost:3000/tarefas?board_id=${boardAtual}`
            );
            const tarefas = await res.json();

            [1, 2, 3].forEach(colunaId => {
                const coluna = document.getElementById(`coluna-${colunaId}`);

                coluna.ondragover = function(e) {
                    e.preventDefault(); 
                };

                coluna.ondrop = async (e) => {
                    e.preventDefault();

                    const id = e.dataTransfer.getData("id");

                    await fetch(`http://localhost:3000/tarefas/${id}`, {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            coluna_id: colunaId
                        })
                    });

                    listarTarefas();
                };
            });

            document.getElementById("coluna-1").innerHTML = "";
            document.getElementById("coluna-2").innerHTML = "";
            document.getElementById("coluna-3").innerHTML = "";



            tarefas.forEach(t => {
                /*const div = document.createElement("div");
                div.className = "tarefa";*/

                const div = document.createElement("div");

                div.ondragstart = (e) => {
                    e.dataTransfer.setData("id", t.id);
                };
                div.className = "tarefa";
                div.draggable = true; 

                div.ondragstart = (e) => {
                    e.dataTransfer.setData("id", t.id);
                };

                let corPrioridade = "";

                if (t.prioridade === "Alta") corPrioridade = "#e84118";
                else if (t.prioridade === "Média") corPrioridade = "#fbc531";
                else corPrioridade = "#4cd137";

                div.innerHTML = `
                    <strong>${t.titulo}</strong><br>
                    ${t.descricao}<br><br>

                    <span style="
                        background:${corPrioridade};
                        color:white;
                        padding:4px 8px;
                        border-radius:6px;
                        font-size:12px;
                    ">${t.prioridade}</span><br><br>

                   
                    ${t.prazo ? t.prazo.split("T")[0] : "Sem prazo"}<br><br>
                    <button onclick="editarTarefa(${t.id}, '${t.titulo}', '${t.descricao}')">✏️</button>
                    <button onclick="deletarTarefa(${t.id})">🗑️</button>
                `;

                document.getElementById(`coluna-${t.coluna_id}`).appendChild(div);
            });
        }

        async function deletarTarefa(id) {
            await fetch(`http://localhost:3000/tarefas/${id}`, { method: "DELETE" });
            listarTarefas();
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const titulo = document.getElementById("titulo").value;
            const descricao = document.getElementById("descricao").value;
            const coluna_id = parseInt(document.getElementById("coluna_id").value);
            const prioridade = document.getElementById("prioridade").value;
            const prazo = document.getElementById("prazo").value;
            

            await fetch("http://localhost:3000/tarefas", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    titulo,
                    descricao,
                    coluna_id,
                    prioridade,
                    prazo,
                    board_id: boardAtual
                })
            });

            form.reset();
            listarTarefas();
        });async function editarTarefa(id, tituloAtual, descricaoAtual) {
                const novoTitulo = prompt("Novo título:", tituloAtual);
                const novaDescricao = prompt("Nova descrição:", descricaoAtual);

    if (!novoTitulo || !novaDescricao) return;

    await fetch(`http://localhost:3000/tarefas/${id}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            titulo: novoTitulo,
            descricao: novaDescricao
        })
    });

    listarTarefas();
    }
 
    async function moverTarefa(id, colunaAtual) {
        let novaColuna = colunaAtual + 1;
        if (novaColuna > 3) novaColuna = 1;

        await fetch(`http://localhost:3000/tarefas/${id}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                coluna_id: novaColuna
            })
        });

    listarTarefas();
}

    listarBoards();
    listarTarefas();
        
    </script>
</body>
</html>
